{% for c in clients %}<tr><td><a href="{% url 'client_detail' c.pk %}">{{ c.name }}</a>{% if not c.active %} <em class="muted">(inactive)</em>{% endif %}</td><td>{{ c.phone }}</td><td>{{ c.get_service_display }}</td><td>{{ c.monthly_fee }}</td>
<td class="{% if c.balance > 0 %}owe{% endif %}">{{ c.balance }}</td><td>{% if c.paid_this_month %}<span class="pill ok">Paid</span>{% else %}<span class="pill no">Unpaid</span>{% endif %}</td></tr>
{% empty %}<tr><td colspan="6" class="muted">No clients found.</td></tr>{% endfor %}
